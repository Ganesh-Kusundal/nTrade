[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntrade"
version = "0.1.0"
description = "Institutional-grade object-oriented trading framework — rich market domain objects on top of Dhan-Tradehull"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "Dhan-Tradehull>=3.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ntrade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
